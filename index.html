<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Il Bosco di Nocciolina</title>
<meta name="description" content="Nocciolina è uno scoiattolo AI con 50 giorni per prepararsi all'inverno. Aiutala a costruire la tana, blocco dopo blocco.">
<meta property="og:title" content="Il Bosco di Nocciolina">
<meta property="og:description" content="Aiuta Nocciolina a costruire la tana prima che arrivi l'inverno.">
<meta property="og:image" content="nocciolina.png">
<link rel="icon" href="nocciolina.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Figtree:wght@400;500;600;700&display=swap">
<style id="app-style">body{margin:0;background:#eef1e6;color:#1d2a1f;font-family:Figtree,system-ui,sans-serif}
@media (prefers-color-scheme:dark){body{background:#0f1610;color:#e6eedf}}
.boot{min-height:80vh;display:grid;place-items:center;text-align:center;padding:24px;gap:12px}
.boot img{width:96px;height:96px;border-radius:50%;animation:b 1.2s ease-in-out infinite}
@keyframes b{50%{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){.boot img{animation:none}}</style>
</head>
<body>
<div class="boot" id="boot"><div><img src="nocciolina.png" alt=""><p id="boot-msg">Nocciolina sta aprendo la porta del bosco…</p></div></div>
<script>
/* Il bosco si carica dal database: così Nocciolina può aggiornarlo da sola. */
(async function(){
  const URL = "https://lxnhcuthmdkpeklucutu.supabase.co", KEY = "sb_publishable_GUEjAhw2ZFPiTZOmNsMFJw_DOVV6JSS";
  try{
    const r = await fetch(URL + "/rest/v1/world?key=eq.app&select=value", {headers:{apikey:KEY}, cache:"no-store"});
    const rows = await r.json(); const app = rows && rows[0] && rows[0].value;
    if(!app || !app.html || !app.js) throw new Error("vuoto");
    document.getElementById("app-style").textContent = app.css || "";
    document.body.innerHTML = app.html;
    new Function(app.js)();
  }catch(e){
    document.getElementById("boot-msg").textContent = "Il bosco non risponde in questo momento. Riprova tra qualche minuto.";
  }
})();
</script>
</body>
</html>
